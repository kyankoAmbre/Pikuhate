<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="adminPanel">
        <h1>🛡️ Админ-панель</h1>
        <button id="refreshBtn">Обновить</button>
        <button id="logoutAdminBtn">Выйти</button>
        <hr />
        <div id="usersList">
            <h3>Пользователи (только для админа)</h3>
            <ul id="userList"></ul>
        </div>
        <div id="banSection">
            <h3>Бан пользователя</h3>
            <input type="text" id="banUserId" placeholder="ID пользователя" />
            <button id="banBtn">Забанить</button>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>

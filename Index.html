<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Анонимный хейт-форум</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>🔥 Анонимный хейт-форум</h1>
            <div id="auth-section">
                <input type="text" id="username" placeholder="Логин" />
                <input type="password" id="password" placeholder="Пароль" />
                <button id="loginBtn">Войти</button>
                <button id="registerBtn">Зарегистрироваться</button>
                <button id="logoutBtn" style="display:none;">Выйти</button>
            </div>
        </header>

        <section id="admin-access">
            <input type="password" id="adminCode" placeholder="Админский доступ" />
            <button id="adminLoginBtn">Войти как админ</button>
        </section>

        <hr />

        <section id="topics">
            <h2>Темы для хейта</h2>
            <div id="topicList"></div>
        </section>

        <section id="create-topic" style="display:none;">
            <h3>Создать тему (только админ)</h3>
            <input type="text" id="topicName" placeholder="Имя пользователя (цель)" />
            <button id="createTopicBtn">Создать тему</button>
        </section>

        <section id="posts">
            <h3>Посты в теме</h3>
            <div id="postList"></div>
            <textarea id="postContent" placeholder="Ваш анонимный хейт..."></textarea>
            <button id="addPostBtn">Отправить</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
